name: Build FlowCalc

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set version
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = "1.0.${{ github.run_number }}"
          "VERSION=$version" >> $env:GITHUB_ENV
          "SHA=$sha" >> $env:GITHUB_ENV
          Write-Output "Build version: $version (commit $sha)"

      - name: Restore
        run: dotnet restore tests/FlowCalc.Tests/FlowCalc.Tests.csproj

      - name: Build
        run: dotnet build tests/FlowCalc.Tests/FlowCalc.Tests.csproj -c Release --no-restore -p:Version=${{ env.VERSION }} -p:InformationalVersion=${{ env.VERSION }}+${{ env.SHA }}

      - name: Run unit tests
        run: dotnet test tests/FlowCalc.Tests/FlowCalc.Tests.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/FlowCalc/FlowCalc.csproj -c Release -o out -p:Version=${{ env.VERSION }} -p:InformationalVersion=${{ env.VERSION }}+${{ env.SHA }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FlowCalc-${{ env.VERSION }}
          path: out/